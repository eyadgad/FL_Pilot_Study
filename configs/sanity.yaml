experiment_name: sanity_cfba_synthetic
seeds:
- 1699
device: cpu
deterministic: true
num_workers: 0
dataset:
  name: synthetic
  train_limit: 2400
  test_limit: 400
federation:
  n_clients: 4
  rounds: 20
  local_epochs: 1
  batch_size: 64
  lr: 0.1
  momentum: 0.0
  weight_decay: 0.0
  participation_rate: 1.0
  partition: iid
  dirichlet_alpha: 0.5
  min_client_samples: 240
  sample_size_sigma: 0.0
shift:
  kind: none
  strength: 1.0
  rotation_max_deg: 20.0
surrogate:
  kind: linear
  source: linear_surrogate
  epochs: 3
  lr: 0.08
  temperature: 2.0
  l1: 0.0001
  hidden_dim: 64
  max_samples_per_class: 24
  eval_samples_per_class: 16
  ig_steps: 4
  artifact_samples_per_class: 16
artifact:
  topk: 64
  clip_radius: 5.0
  quant_bits: 8
  dp_sigma: 0.0
  missing_variance_scale: 4.0
  send_variance: false
  sparse_intersection_only: true
alignment:
  beta: 0.2
  methods:
  - local
  - fedattr_mean
  - xfedalign_median
  - global_crc
  - cfba_crc
  cfba_alpha: 0.05
  cfba_beta_grid:
  - 0.0
  - 0.1
  - 0.2
  - 0.4
  - 0.6
  - 0.8
  cfba_calibration_samples_per_client: 20
  cfba_min_calibration_samples: 20
evaluation:
  deletion_steps: 6
  eval_batch_size: 64
  max_eval_samples: 96
  compute_oracle_local_fidelity: true
  oracle_samples_per_class: 24
  topk_overlap_k: 32
  bootstrap_samples: 200
  deletion_insertion_samples_per_client: 4
  primary_metric: sample_fidelity_jsd
attack:
  enabled: false
  fraction: 0.25
  strength: 0.3
  kind: artifact_shift
logging:
  output_root: ./verification/cfba_sanity/output
  save_checkpoints: true
  save_artifacts: true
  log_every_round: true
tags:
  purpose: end_to_end_cfba_sanity
  nonconfirmatory_seed: 1699
