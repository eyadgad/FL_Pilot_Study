device: auto
deterministic: true
num_workers: 0
dataset:
  name: mnist
  root: ./data
  download: true
federation:
  n_clients: 6
  rounds: 18
  local_epochs: 1
  batch_size: 64
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  participation_rate: 1.0
  partition: dirichlet
  dirichlet_alpha: 0.35
  min_client_samples: 600
  sample_size_sigma: 0.0
shift:
  kind: rotation
  strength: 1.0
  rotation_max_deg: 30
  patch_size: 4
  patch_value: 1.0
  drift_start_round: 7
  drift_end_round: 18
surrogate:
  kind: linear
  source: linear_surrogate
  epochs: 3
  lr: 0.1
  temperature: 3.0
  l1: 0.0001
  hidden_dim: 128
  max_samples_per_class: 24
  eval_samples_per_class: 16
  ig_steps: 12
  artifact_samples_per_class: 16
artifact:
  topk: 128
  clip_radius: 5.0
  quant_bits: 8
  dp_sigma: 0.05
  missing_variance_scale: 4.0
  send_variance: false
  sparse_intersection_only: true
alignment:
  methods:
  - local
  - fedattr_mean
  - xfedalign_median
  - xfedalign_beta_0p4
  - iflash_proxy
  - rwssa
  - rwssa_sparse
  - rwssa_binary
  - rwssa_no_safety
  - rwssa_no_calibration
  - rwssa_class_scalar
  beta: 0.2
  rwssa_rho: 0.3
  rwssa_alpha: 0.05
  rwssa_grid:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  rwssa_selection_samples: 24
  rwssa_calibration_samples: 64
  rwssa_risk_mode: jsd_topk
evaluation:
  deletion_steps: 8
  eval_batch_size: 64
  max_eval_samples: 96
  compute_oracle_local_fidelity: true
  oracle_samples_per_class: 24
  topk_overlap_k: 64
  bootstrap_samples: 4000
  deletion_insertion_samples_per_client: 16
  primary_metric: sample_fidelity_jsd
attack:
  enabled: true
  fraction: 0.25
  strength: 0.3
  kind: artifact_shift
logging:
  output_root: ./outputs
  save_checkpoints: true
  save_artifacts: true
  log_every_round: true
experiment_name: b_mnist_artifact_shift
seeds:
- 2601
- 2602
- 2603
- 2604
- 2605
tags:
  tier: B
  status: stress
  method: RWSSA
  role: rotation
